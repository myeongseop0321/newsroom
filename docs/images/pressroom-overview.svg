  <text x="124" y="562" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#6b7280">작은 사진 + 제목</text>
  <rect x="374" y="300" width="390" height="350" rx="12" fill="#f8fafc" stroke="#d7dde6"/>
  <rect x="398" y="324" width="342" height="194" rx="10" fill="#d1fae5"/>
  <circle cx="450" cy="376" r="24" fill="#34d399"/>
  <path d="M398 501 L506 420 L590 484 L650 438 L740 501 Z" fill="#10b981" opacity=".55"/>
  <rect x="398" y="546" width="136" height="18" rx="9" fill="#059669"/>
  <text x="398" y="592" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="30" font-weight="850" fill="#111827">메인 기사</text>
  <text x="398" y="624" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#6b7280">가장 눈에 띄는 대표 뉴스</text>
  <rect x="792" y="318" width="188" height="286" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <rect x="812" y="338" width="148" height="92" rx="8" fill="#fee2e2"/>
  <rect x="812" y="460" width="90" height="14" rx="7" fill="#ef4444"/>
  <text x="812" y="502" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="800" fill="#111827">우측 기사</text>
  <text x="812" y="530" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#6b7280">작은 사진 + 제목</text>
  <rect x="1006" y="300" width="150" height="350" rx="16" fill="#111827"/>
  <text x="1028" y="340" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="800" fill="#ffffff">이슈 랭킹</text>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#d1d5db">
    <circle cx="1032" cy="382" r="13" fill="#3182f6"/><text x="1028" y="387" font-weight="800" fill="#ffffff">1</text><text x="1054" y="387">공통 보도</text>
    <circle cx="1032" cy="430" r="13" fill="#4b5563"/><text x="1028" y="435" font-weight="800" fill="#ffffff">2</text><text x="1054" y="435">경제 이슈</text>
    <circle cx="1032" cy="478" r="13" fill="#4b5563"/><text x="1028" y="483" font-weight="800" fill="#ffffff">3</text><text x="1054" y="483">정치 현안</text>
  </g>
