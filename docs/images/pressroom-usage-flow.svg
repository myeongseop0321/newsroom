<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">PRESSROOM 사용 흐름</title>
  <desc id="desc">로그인, 언론사 선택, 뉴스 읽기, 이슈 팔로우업, 스크랩까지 이어지는 사용 예시</desc>
  <rect width="1280" height="520" fill="#f7f9fc"/>
  <text x="80" y="82" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="40" font-weight="850" fill="#111827">사용 흐름</text>
  <text x="80" y="116" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#6b7280">처음 접속한 사용자가 개인 뉴스 데스크를 완성하는 과정입니다.</text>
  <g font-family="Arial, 'Noto Sans KR', sans-serif">
    <g transform="translate(80 174)">
      <rect width="180" height="220" rx="18" fill="#ffffff" stroke="#d9e1ec"/>
      <circle cx="90" cy="58" r="28" fill="#dbeafe"/>
      <path d="M78 59 h24 M90 47 v24" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
      <text x="28" y="118" font-size="24" font-weight="800" fill="#111827">로그인</text>
      <text x="28" y="153" font-size="14" fill="#6b7280">개인 설정과</text>
      <text x="28" y="176" font-size="14" fill="#6b7280">스크랩을 저장</text>
      <text x="28" y="206" font-size="13" font-weight="800" fill="#3182f6">STEP 01</text>
    </g>
    <path d="M282 284 H356" stroke="#bac5d5" stroke-width="3" stroke-linecap="round"/>
    <path d="M346 274 L358 284 L346 294" fill="none" stroke="#bac5d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(376 174)">
      <rect width="180" height="220" rx="18" fill="#ffffff" stroke="#d9e1ec"/>
      <circle cx="90" cy="58" r="28" fill="#dcfce7"/>
      <rect x="67" y="43" width="46" height="31" rx="7" fill="#22c55e"/>
      <path d="M76 59 l10 10 l20 -24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="118" font-size="24" font-weight="800" fill="#111827">언론사 선택</text>
      <text x="28" y="153" font-size="14" fill="#6b7280">보고 싶은 매체를</text>
      <text x="28" y="176" font-size="14" fill="#6b7280">사용자별 저장</text>
      <text x="28" y="206" font-size="13" font-weight="800" fill="#16a34a">STEP 02</text>
    </g>
    <path d="M578 284 H652" stroke="#bac5d5" stroke-width="3" stroke-linecap="round"/>
    <path d="M642 274 L654 284 L642 294" fill="none" stroke="#bac5d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(672 174)">
      <rect width="180" height="220" rx="18" fill="#ffffff" stroke="#d9e1ec"/>
      <circle cx="90" cy="58" r="28" fill="#fee2e2"/>
      <rect x="67" y="42" width="46" height="34" rx="4" fill="#ef4444"/>
      <path d="M76 53 h28 M76 63 h22" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <text x="28" y="118" font-size="24" font-weight="800" fill="#111827">뉴스 읽기</text>
      <text x="28" y="153" font-size="14" fill="#6b7280">오늘의 뉴스와</text>
      <text x="28" y="176" font-size="14" fill="#6b7280">이슈 랭킹 확인</text>
      <text x="28" y="206" font-size="13" font-weight="800" fill="#dc2626">STEP 03</text>
    </g>
    <path d="M874 284 H948" stroke="#bac5d5" stroke-width="3" stroke-linecap="round"/>
    <path d="M938 274 L950 284 L938 294" fill="none" stroke="#bac5d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(968 174)">
      <rect width="180" height="220" rx="18" fill="#ffffff" stroke="#d9e1ec"/>
      <circle cx="90" cy="58" r="28" fill="#fef3c7"/>
      <path d="M64 63 H116" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
      <circle cx="76" cy="63" r="8" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
      <circle cx="100" cy="63" r="8" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
      <text x="28" y="118" font-size="24" font-weight="800" fill="#111827">팔로우업</text>
      <text x="28" y="153" font-size="14" fill="#6b7280">검색어 기반</text>
      <text x="28" y="176" font-size="14" fill="#6b7280">타임라인 탐색</text>
      <text x="28" y="206" font-size="13" font-weight="800" fill="#d97706">STEP 04</text>
    </g>
  </g>
</svg>
